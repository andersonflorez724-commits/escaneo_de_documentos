{% extends "base.html" %}

{% block title %}Pagina no encontrada &middot; {{ app_name }}{% endblock %}

{% block content %}
<div class="card card--form card--center">
  <span class="card__icon" aria-hidden="true">🧭</span>
  <h1 class="card__title">Pagina no encontrada</h1>

  <a class="btn btn--primary mt-2" href="{% url 'scanner:index' %}">Volver al escaner</a>
</div>
{% endblock %}
