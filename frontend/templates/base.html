{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Lectura e inspeccion automatica de documentos de identificacion con OCR e IA.">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪪</text></svg>">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t === 'dark' || t === 'light') {
          document.documentElement.setAttribute('data-theme', t);
        }
      } catch (e) { /* sin storage: tema claro por defecto */ }
    })();
  </script>
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body class="app">

  <header class="topbar">
    <div class="topbar__inner">
      <a class="brand" href="{% url 'scanner:index' %}">
        <span class="brand__mark" aria-hidden="true">🪪</span>
        <span class="brand__text">
          <strong>Lector de Documentos</strong>
          <small>OCR + IA</small>
        </span>
      </a>

      <nav class="nav" aria-label="Navegacion principal">
        <a class="nav__link {% if active == 'scanner' %}is-active{% endif %}" href="{% url 'scanner:index' %}">Escanear</a>
        <button
          type="button"
          class="theme-toggle"
          id="theme-toggle"
          title="Cambiar claro / oscuro"
          aria-label="Cambiar entre modo claro y oscuro"
        ><span id="theme-toggle-icon" aria-hidden="true">🌙</span></button>
      </nav>
    </div>
  </header>

  <main class="main">
    {% block content %}{% endblock %}
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <footer class="footer">
    <div class="footer__inner">
      <span>&copy; {% now "Y" %} {{ app_name }} &middot; v{{ app_version }}</span>
      <span class="footer__stack">Django + FastAPI + RapidOCR</span>
    </div>
  </footer>

  <script>
    (function () {
      var root = document.documentElement;
      var btn = document.getElementById('theme-toggle');
      var icon = document.getElementById('theme-toggle-icon');
      function current() {
        return root.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
      }
      function paint() {
        if (icon) icon.textContent = current() === 'dark' ? '☀️' : '🌙';
      }
      paint();
      if (btn) {
        btn.addEventListener('click', function () {
          var next = current() === 'dark' ? 'light' : 'dark';
          root.setAttribute('data-theme', next);
          try { localStorage.setItem('theme', next); } catch (e) { /* ok */ }
          paint();
        });
      }
    })();
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
